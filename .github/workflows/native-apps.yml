name: Native apps

# Builds the Android app (Capacitor) and the desktop apps (Tauri) from the same
# static export as the website. See native/README.md.
#
# - Every push to `redesign` (or a manual run) builds all apps and attaches
#   them to the run as artifacts.
# - Pushing a tag `app-v*` (e.g. app-v0.2.0) also publishes a GitHub Release
#   with the APK and the Windows / macOS / Linux installers.
#
# Optional secrets for a signed release APK (otherwise the debug APK is shipped):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD

on:
  push:
    branches: [redesign]
    tags: ["app-v*"]
    paths-ignore: ["docs/**", "design/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.amazecc.com' }}
  NEXT_PUBLIC_BACKUP_API_URL: ${{ vars.NEXT_PUBLIC_BACKUP_API_URL || 'https://amazecc-api-d402b5.rivendeploy.com' }}
  NEXT_PUBLIC_UNICC_API_URL: ${{ vars.NEXT_PUBLIC_UNICC_API_URL || 'https://api-unicc.arya22.dev' }}
  NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN || 'phc_obkUKCrFiFpJGfqSbx9LsJzmZDNdzdHhvpSFDhxSwGUt' }}
  NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://shoot.amazecc.com' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            name="${GITHUB_REF#refs/tags/app-v}"
          else
            name="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  web:
    name: Web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/native/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: out
          retention-days: 3

  android:
    name: Android APK
    needs: [version, web]
    runs-on: ubuntu-latest
    env:
      AMAZECC_VERSION_NAME: ${{ needs.version.outputs.name }}
      AMAZECC_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: out
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Release keystore (optional)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          SKIP_WEB_BUILD: "1"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/native/build-android.sh
      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          cp native/capacitor/android/app/build/outputs/apk/debug/app-debug.apk "dist/AmazeCC-${AMAZECC_VERSION_NAME}-debug.apk"
          if [ -f native/capacitor/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp native/capacitor/android/app/build/outputs/apk/release/app-release.apk "dist/AmazeCC-${AMAZECC_VERSION_NAME}.apk"
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [version, web]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native/tauri/src-tauri -> target
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Set version
        shell: bash
        run: |
          node -e "const f='native/tauri/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='${{ needs.version.outputs.name }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
      - name: Build
        shell: bash
        env:
          SKIP_WEB_BUILD: "1"
        run: bash scripts/native/build-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            native/tauri/src-tauri/target/release/bundle/**/*.exe
            native/tauri/src-tauri/target/release/bundle/**/*.msi
            native/tauri/src-tauri/target/release/bundle/**/*.dmg
            native/tauri/src-tauri/target/release/bundle/**/*.AppImage
            native/tauri/src-tauri/target/release/bundle/**/*.deb
            native/tauri/src-tauri/target/release/bundle/**/*.rpm

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [version, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List files
        run: find dist -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) | sort
      - uses: softprops/action-gh-release@v2
        with:
          name: AmazeCC ${{ needs.version.outputs.name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/**/*.apk
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
